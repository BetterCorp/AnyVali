name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      nuget_only:
        description: Publish only NuGet for an existing release tag
        type: boolean
        default: false
      release_tag:
        description: Existing version tag for NuGet-only recovery (for example v1.1.7)
        type: string
        required: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_ref: ${{ steps.version.outputs.source_ref }}
    steps:
      - name: Read version from tag
        id: version
        shell: bash
        env:
          NUGET_ONLY: ${{ inputs.nuget_only }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$NUGET_ONLY" == "true" ]]; then
            release_tag="$RECOVERY_TAG"
          elif [[ -n "$RECOVERY_TAG" ]]; then
            echo "release_tag is only supported with nuget_only enabled" >&2
            exit 1
          fi
          version="${release_tag#v}"
          if [[ "$release_tag" != v* || ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=refs/tags/$release_tag" >> "$GITHUB_OUTPUT"

  npm:
    permissions:
      contents: read
      id-token: write
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Set package version from tag
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check npm version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "anyvali@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.version.outputs.exists != 'true'
        run: npm publish --access public

  pypi:
    permissions:
      contents: read
      id-token: write
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Set package version from tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("sdk/python/pyproject.toml")
          text = path.read_text()
          text, count = re.subn(r'(?m)^version = ".*"$', f'version = "{os.environ["VERSION"]}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not set Python package version")
          path.write_text(text)
          PY
      - name: Build package
        run: |
          cp README.md sdk/python/README.md
          cd sdk/python
          pip install build pytest
          PYTHONPATH=src python -m pytest tests -q
          python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true

  go:
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.11"
      - name: Verify Go module
        working-directory: sdk/go
        run: go mod verify

  maven:
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set package version from tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Publish to Maven Central
        run: mvn -B deploy -DskipTests -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  kotlin:
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: sdk/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Set package version from tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("build.gradle.kts")
          text = path.read_text()
          text, count = re.subn(r'(?m)^version = ".*"', f'version = "{os.environ["VERSION"]}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not set Kotlin package version")
          path.write_text(text)
          PY
      - name: Publish to Maven Central
        run: gradle --no-daemon publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  crates:
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Set package version from tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("sdk/rust/Cargo.toml")
          text = path.read_text()
          text, count = re.subn(r'(?m)^version = ".*"$', f'version = "{os.environ["VERSION"]}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not set Rust package version")
          path.write_text(text)
          PY
      - name: Publish to crates.io
        run: |
          cp README.md sdk/rust/README.md
          cd sdk/rust
          cargo publish --allow-dirty --token "$CRATES_TOKEN"
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  nuget:
    needs: version
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: sdk/csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
      - name: Check NuGet profile configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Set the NUGET_USER repository variable to your NuGet.org profile name."
            exit 1
          fi
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"
      - name: Set package version from tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("src/AnyVali/AnyVali.csproj")
          text = path.read_text()
          text, count = re.subn(r'<Version>.*</Version>', f'<Version>{os.environ["VERSION"]}</Version>', text, count=1)
          if count != 1:
              raise SystemExit("Could not set NuGet package version")
          path.write_text(text)
          PY
      - run: dotnet restore AnyVali.sln
      - run: dotnet build AnyVali.sln --configuration Release --no-restore
      - run: dotnet test AnyVali.sln --configuration Release --no-build
      - run: dotnet pack --configuration Release --no-build -o nupkgs
      - name: Authenticate to NuGet with OIDC
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

  rubygems:
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: sdk/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3"
      - name: Set package version from tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("anyvali.gemspec")
          text = path.read_text()
          text, count = re.subn(r's\.version\s+=\s+".*?"', f's.version     = "{os.environ["VERSION"]}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not set Ruby package version")
          path.write_text(text)
          PY
      - name: Build and publish gem
        run: |
          cp ../../README.md README.md
          mkdir -p ~/.gem
          cat <<CRED > ~/.gem/credentials
          ---
          :rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}
          CRED
          chmod 0600 ~/.gem/credentials
          gem build anyvali.gemspec
          gem push anyvali-*.gem
          rm -f ~/.gem/credentials

  php-source:
    if: ${{ !inputs.nuget_only }}
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer
      - name: Validate PHP source installation
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash tools/release/smoke_php_install.sh sdk/php "$RELEASE_VERSION"

  cli:
    if: ${{ !inputs.nuget_only }}
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: anyvali-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            name: anyvali-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: anyvali-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: anyvali-darwin-arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            name: anyvali-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.11"
          cache: false
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd cli
          go build -ldflags="-s -w -X github.com/BetterCorp/AnyVali/cli/cmd.Version=$VERSION -X github.com/BetterCorp/AnyVali/cli/server.Version=$VERSION" -o ../${{ matrix.name }} .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  cli-upload:
    permissions:
      contents: write
    if: ${{ !inputs.nuget_only }}
    needs: [cli, version, php-source]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: binaries
          merge-multiple: true
      - name: Make binaries executable
        run: chmod +x binaries/anyvali-linux-* binaries/anyvali-darwin-*
      - name: Generate checksums
        run: |
          cd binaries
          sha256sum * > checksums-sha256.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Delete it and push a new tag; published releases are immutable." >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" --target "${{ github.sha }}" --draft --latest --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" binaries/*
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
