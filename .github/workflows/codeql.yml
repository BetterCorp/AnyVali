name: CodeQL

on:
  push:
    branches:
      - "**"
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
          - go
          - java-kotlin
          - csharp
          - ruby
          - cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.11"
          cache: false

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Setup C++ build tools
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Build Go
        if: matrix.language == 'go'
        run: |
          cd sdk/go && go build ./...
          cd ../../cli && go build ./...

      - name: Build Java
        if: matrix.language == 'java-kotlin'
        run: |
          cd sdk/java && mvn -B compile -DskipTests

      - name: Build C#
        if: matrix.language == 'csharp'
        run: |
          cd sdk/csharp
          dotnet restore AnyVali.sln
          dotnet build AnyVali.sln --no-restore

      - name: Build C++
        if: matrix.language == 'cpp'
        run: |
          cd sdk/cpp
          mkdir -p build && cd build
          cmake .. && cmake --build .

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
